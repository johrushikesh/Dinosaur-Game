<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sky Dash</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; background:#0b0b2a; overflow:hidden; touch-action:none;
    user-select:none; -webkit-user-select:none; font-family:'Segoe UI',system-ui,sans-serif; color:#fff; }
  #game { position:fixed; inset:0; display:block; }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:14px; background:rgba(8,8,34,.82); backdrop-filter:blur(6px);
    z-index:10; padding:20px; text-align:center; }
  .hidden { display:none !important; }
  h1 { font-size:min(13vw,64px); font-weight:900; letter-spacing:2px;
    background:linear-gradient(90deg,#4dffdf,#4d9fff,#c44dff); -webkit-background-clip:text;
    background-clip:text; color:transparent; filter:drop-shadow(0 0 18px rgba(77,159,255,.55)); }
  .sub { color:#9fb5ff; font-size:15px; max-width:340px; line-height:1.5; }
  .btn { border:none; border-radius:16px; padding:16px 42px; font-size:20px; font-weight:800;
    color:#08082a; background:linear-gradient(90deg,#4dffdf,#4d9fff); cursor:pointer;
    box-shadow:0 6px 24px rgba(77,159,255,.45); letter-spacing:1px; }
  .btn:active { transform:scale(.96); }
  .btn.small { padding:10px 22px; font-size:15px; border-radius:12px; }
  .btn.ghost { background:rgba(255,255,255,.1); color:#cfe0ff; box-shadow:none; }
  .statrow { display:flex; gap:22px; font-size:14px; color:#9fb5ff; }
  .statrow b { color:#ffd94d; font-size:19px; display:block; }
  .missions { width:min(88vw,360px); display:flex; flex-direction:column; gap:8px; }
  .mission { background:rgba(255,255,255,.07); border:1px solid rgba(120,160,255,.25);
    border-radius:12px; padding:9px 12px; font-size:13px; text-align:left; color:#cfe0ff; }
  .mission .bar { height:5px; background:rgba(255,255,255,.12); border-radius:3px; margin-top:6px; overflow:hidden; }
  .mission .bar i { display:block; height:100%; background:linear-gradient(90deg,#4dffdf,#4d9fff); border-radius:3px; }
  .mission.done { border-color:#4dffb0; color:#4dffb0; }
  .skins { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width:360px; }
  .skin { width:72px; padding:8px 4px 6px; border-radius:14px; background:rgba(255,255,255,.07);
    border:2px solid transparent; cursor:pointer; font-size:11px; color:#9fb5ff; }
  .skin .dot { width:30px; height:30px; border-radius:9px; margin:0 auto 5px; }
  .skin.sel { border-color:#4dffdf; }
  .skin.locked { opacity:.65; }
  .price { color:#ffd94d; font-weight:700; }
  #hud { position:fixed; top:0; left:0; right:0; padding:max(10px,env(safe-area-inset-top)) 14px 0;
    display:flex; justify-content:space-between; align-items:flex-start; z-index:5; pointer-events:none;
    font-weight:800; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  #hudScore { font-size:26px; }
  #hudCoins { color:#ffd94d; font-size:17px; }
  #hudBest  { color:#9fb5ff; font-size:12px; font-weight:600; }
  #toasts { position:fixed; top:22%; left:0; right:0; display:flex; flex-direction:column;
    align-items:center; gap:6px; z-index:6; pointer-events:none; }
  .toast { font-weight:900; font-size:20px; color:#4dffdf; text-shadow:0 0 14px rgba(77,255,223,.8);
    animation:toast 1.1s ease forwards; }
  .toast.gold { color:#ffd94d; text-shadow:0 0 14px rgba(255,217,77,.8); }
  @keyframes toast { 0%{opacity:0;transform:translateY(14px) scale(.8);} 15%{opacity:1;transform:none;}
    80%{opacity:1;} 100%{opacity:0;transform:translateY(-18px);} }
  #streakTag { position:fixed; bottom:max(12px,env(safe-area-inset-bottom)); left:0; right:0;
    text-align:center; font-size:12px; color:#7d90c9; z-index:11; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div><div id="hudScore">0</div><div id="hudBest">BEST 0</div></div>
  <div id="hudCoins">🪙 0</div>
</div>
<div id="toasts"></div>

<div id="menu" class="screen">
  <h1>SKY DASH</h1>
  <div class="sub">Swipe ◀ ▶ to change lane · swipe ▲ jump · swipe ▼ slide.<br>Dodge, grab coins, chase the streak!</div>
  <div class="statrow">
    <span>BEST<b id="mBest">0</b></span>
    <span>COINS<b id="mCoins">0</b></span>
    <span>STREAK<b id="mStreak">0🔥</b></span>
  </div>
  <div class="missions" id="mMissions"></div>
  <button class="btn" id="playBtn">▶ RUN</button>
  <button class="btn small ghost" id="skinBtn">🎨 Skins</button>
</div>

<div id="shop" class="screen hidden">
  <h1 style="font-size:34px">SKINS</h1>
  <div class="statrow"><span>COINS<b id="sCoins">0</b></span></div>
  <div class="skins" id="skinList"></div>
  <button class="btn small ghost" id="backBtn">← Back</button>
</div>

<div id="over" class="screen hidden">
  <h1 style="font-size:40px">WIPEOUT!</h1>
  <div class="statrow">
    <span>SCORE<b id="oScore">0</b></span>
    <span>COINS<b id="oCoins">0</b></span>
    <span>BEST<b id="oBest">0</b></span>
  </div>
  <div class="sub" id="oNew"></div>
  <button class="btn" id="againBtn">↻ RUN AGAIN</button>
  <button class="btn small ghost" id="menuBtn">Menu</button>
</div>
<div id="streakTag"></div>

<script>
'use strict';
/* ============ persistence ============ */
const store = {
  get(k,d){ try{ const v=localStorage.getItem('sd_'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('sd_'+k, JSON.stringify(v)); }catch(e){} }
};
let best   = store.get('best',0);
let wallet = store.get('coins',0);
let totals = store.get('totals',{coins:0,powerups:0,runs:0});

/* daily streak */
const today = new Date().toDateString();
let streak = store.get('streak',0), lastDay = store.get('lastDay','');
let streakBonus = 0;
if (lastDay !== today){
  const yest = new Date(Date.now()-864e5).toDateString();
  streak = (lastDay===yest) ? streak+1 : 1;
  streakBonus = 50 + (streak-1)*25;
  wallet += streakBonus;
  store.set('streak',streak); store.set('lastDay',today); store.set('coins',wallet);
}

/* ============ skins ============ */
const SKINS = [
  {id:'mint',   name:'Mint',    cost:0,    body:'#4dffdf', trail:'#4dffdf'},
  {id:'sunset', name:'Sunset',  cost:500,  body:'#ff9d4d', trail:'#ff4d6d'},
  {id:'violet', name:'Violet',  cost:1500, body:'#c44dff', trail:'#7a4dff'},
  {id:'gold',   name:'GoldRex', cost:5000, body:'#ffd94d', trail:'#fff2b0'},
];
let owned = store.get('owned',['mint']);
let skinId = store.get('skin','mint');
const skin = () => SKINS.find(s=>s.id===skinId) || SKINS[0];

/* ============ missions ============ */
const MISSION_POOL = [
  {id:'c150', txt:'Collect 150 coins (total)',   type:'coins_total',    n:150, reward:120},
  {id:'c400', txt:'Collect 400 coins (total)',   type:'coins_total',    n:400, reward:250},
  {id:'nm3',  txt:'3 near-misses in one run',    type:'nearmiss_run',   n:3,   reward:150},
  {id:'nm6',  txt:'6 near-misses in one run',    type:'nearmiss_run',   n:6,   reward:300},
  {id:'s45',  txt:'Survive 45s in one run',      type:'survive_run',    n:45,  reward:150},
  {id:'s90',  txt:'Survive 90s in one run',      type:'survive_run',    n:90,  reward:350},
  {id:'p3',   txt:'Grab 3 power-ups (total)',    type:'powerups_total', n:3,   reward:120},
  {id:'sc2k', txt:'Score 2000 in one run',       type:'score_run',      n:2000,reward:200},
  {id:'sc5k', txt:'Score 5000 in one run',       type:'score_run',      n:5000,reward:400},
];
let missions = store.get('missions',null);
function newMission(exclude){
  const pool = MISSION_POOL.filter(m=>!exclude.includes(m.id));
  const m = pool[Math.floor(Math.random()*pool.length)];
  return {id:m.id, prog:0};
}
if (!missions){
  missions = [];
  while (missions.length<3) missions.push(newMission(missions.map(m=>m.id)));
  store.set('missions',missions);
}
const missionDef = id => MISSION_POOL.find(m=>m.id===id);

/* ============ audio ============ */
let ac=null;
function initAudio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function snd(f,dur=0.08,type='sine',vol=0.12,slide=0){
  if(!ac || ac.state==='suspended') return;
  const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
}
const sCoin =(c)=>snd(660+c*40,0.07,'sine',0.10);
const sJump =()=>snd(300,0.15,'triangle',0.12,260);
const sSlide=()=>snd(260,0.12,'triangle',0.10,-120);
const sHit  =()=>{snd(120,0.3,'sawtooth',0.2,-70); snd(60,0.4,'square',0.15,-30);};
const sPow  =()=>{snd(440,0.1,'square',0.08); setTimeout(()=>snd(660,0.1,'square',0.08),90); setTimeout(()=>snd(880,0.14,'square',0.08),180);};
const sNear =()=>snd(880,0.12,'sine',0.1,220);

/* ============ canvas ============ */
const cv = document.getElementById('game'), cx2 = cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width=W+'px'; cv.style.height=H+'px';
  cx2.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize',resize); resize();

/* ============ world ============ */
const D_MAX = 100;                 // horizon distance
const PLAYER_D = 14;               // player distance from camera plane
const LANES = [-1,0,1];
let state='menu';
let ents=[], parts=[], stars=[];
let dist=0, speed=0, score=0, runCoins=0, runTime=0, coinCombo=0, comboTimer=0;
let lane=0, laneX=0;               // laneX = smooth visual lane position
let jumpT=-1, slideT=-1;
let shield=false, magnetT=0, doubleT=0;
let nearRun=0, lastLaneSwap={lane:0,at:-9};
let shake=0, hitFlash=0;
let spawnGap=0;

for(let i=0;i<70;i++) stars.push({x:Math.random(),y:Math.random()*0.5,s:Math.random()*1.6+0.4});

function horizonY(){ return H*0.34; }
function project(d,ln){
  const t = Math.max(0, Math.min(1.15, (D_MAX-d)/(D_MAX-0) ));
  const p = Math.pow(t,2.6);
  const y = horizonY() + (H*0.98-horizonY())*p;
  const sc = 0.06+0.94*p;
  const x = W/2 + ln*(W*0.30)*sc;
  return {x,y,sc,p};
}

function reset(){
  ents=[]; parts=[]; dist=0; speed=34; score=0; runCoins=0; runTime=0;
  lane=0; laneX=0; jumpT=-1; slideT=-1; shield=false; magnetT=0; doubleT=0;
  nearRun=0; coinCombo=0; comboTimer=0; shake=0; hitFlash=0; spawnGap=24;
}

/* spawn a row of stuff at the horizon */
function spawnRow(){
  const r = Math.random();
  const freeLane = LANES[Math.floor(Math.random()*3)];
  if (r < 0.16 && dist>250){          // double block: only freeLane open
    for(const ln of LANES) if(ln!==freeLane) ents.push({k:'obs',t:'block',ln,d:D_MAX});
    ents.push({k:'coin',ln:freeLane,d:D_MAX});
    ents.push({k:'coin',ln:freeLane,d:D_MAX+7});
  } else if (r < 0.42){               // single full block
    const ln = LANES[Math.floor(Math.random()*3)];
    ents.push({k:'obs',t:'block',ln,d:D_MAX});
  } else if (r < 0.62){               // low barrier — jump it
    const ln = LANES[Math.floor(Math.random()*3)];
    ents.push({k:'obs',t:'low',ln,d:D_MAX});
  } else if (r < 0.78){               // high barrier — slide it
    const ln = LANES[Math.floor(Math.random()*3)];
    ents.push({k:'obs',t:'high',ln,d:D_MAX});
  } else if (r < 0.92){               // coin trail
    const ln = LANES[Math.floor(Math.random()*3)];
    for(let i=0;i<5;i++) ents.push({k:'coin',ln,d:D_MAX+i*7});
  } else {                            // power-up
    const kinds=['magnet','shield','x2'];
    ents.push({k:'pow',t:kinds[Math.floor(Math.random()*3)],ln:freeLane,d:D_MAX});
  }
}

/* ============ input ============ */
function doLane(dir){
  if(state!=='play') return;
  const nl = Math.max(-1,Math.min(1,lane+dir));
  if(nl!==lane){ lastLaneSwap={lane:lane,at:runTime}; lane=nl; }
}
function doJump(){ if(state==='play' && jumpT<0 && slideT<0){ jumpT=0; sJump(); } }
function doSlide(){ if(state==='play' && slideT<0 && jumpT<0){ slideT=0; sSlide(); } }

let pStart=null;
window.addEventListener('pointerdown',e=>{ initAudio(); if(ac&&ac.state==='suspended')ac.resume(); pStart={x:e.clientX,y:e.clientY,t:performance.now()}; });
window.addEventListener('pointerup',e=>{
  if(!pStart) return;
  const dx=e.clientX-pStart.x, dy=e.clientY-pStart.y;
  const adx=Math.abs(dx), ady=Math.abs(dy);
  if(Math.max(adx,ady)>24){
    if(adx>ady) doLane(dx>0?1:-1);
    else dy<0 ? doJump() : doSlide();
  }
  pStart=null;
});
window.addEventListener('keydown',e=>{
  if(e.repeat) return;
  initAudio(); if(ac&&ac.state==='suspended')ac.resume();
  if(e.key==='ArrowLeft'||e.key==='a') doLane(-1);
  else if(e.key==='ArrowRight'||e.key==='d') doLane(1);
  else if(e.key==='ArrowUp'||e.key==='w'||e.key===' ') doJump();
  else if(e.key==='ArrowDown'||e.key==='s') doSlide();
});

/* ============ toasts & missions ============ */
const toastBox=document.getElementById('toasts');
function toast(txt,gold){
  const el=document.createElement('div');
  el.className='toast'+(gold?' gold':''); el.textContent=txt;
  toastBox.appendChild(el); setTimeout(()=>el.remove(),1150);
}
function missionProgress(type,val,isMax){
  let changed=false;
  for(const m of missions){
    const def=missionDef(m.id);
    if(def.type!==type || m.prog>=def.n) continue;
    m.prog = isMax ? Math.max(m.prog,val) : m.prog+val;
    if(m.prog>=def.n){
      m.prog=def.n; wallet+=def.reward; store.set('coins',wallet);
      toast('✔ MISSION! +'+def.reward+' 🪙',true); sPow();
      m.doneAt=Date.now();
    }
    changed=true;
  }
  if(changed) store.set('missions',missions);
}
function rotateDoneMissions(){
  let changed=false;
  missions=missions.map(m=>{
    const def=missionDef(m.id);
    if(m.prog>=def.n){ changed=true; return newMission(missions.map(x=>x.id)); }
    return m;
  });
  if(changed) store.set('missions',missions);
}

/* ============ game over ============ */
function gameOver(){
  state='over'; sHit(); shake=14; hitFlash=1;
  missionProgress('score_run',score,true);
  missionProgress('survive_run',runTime,true);
  missionProgress('nearmiss_run',nearRun,true);
  totals.runs++; store.set('totals',totals);
  wallet+=0; store.set('coins',wallet);
  const isNew = score>best;
  if(isNew){ best=score; store.set('best',best); }
  document.getElementById('oScore').textContent=score;
  document.getElementById('oCoins').textContent=runCoins;
  document.getElementById('oBest').textContent=best;
  document.getElementById('oNew').textContent = isNew ? '🏆 NEW BEST SCORE!' : '';
  setTimeout(()=>{ document.getElementById('over').classList.remove('hidden');
                   document.getElementById('hud').classList.add('hidden'); },450);
}

/* ============ update ============ */
function update(dt){
  runTime+=dt;
  speed = Math.min(80, 34 + runTime*1.05);
  dist += speed*dt;
  score += Math.round(speed*dt*(doubleT>0?2:1)*2);

  /* lane easing */
  laneX += (lane-laneX)*Math.min(1,dt*12);

  /* jump / slide */
  if(jumpT>=0){ jumpT+=dt/0.62; if(jumpT>1) jumpT=-1; }
  if(slideT>=0){ slideT+=dt/0.6; if(slideT>1) slideT=-1; }
  if(magnetT>0) magnetT-=dt;
  if(doubleT>0) doubleT-=dt;
  if(comboTimer>0){ comboTimer-=dt; if(comboTimer<=0) coinCombo=0; }

  /* spawning */
  spawnGap -= speed*dt;
  if(spawnGap<=0){
    spawnRow();
    spawnGap = 26 + Math.random()*16 - Math.min(10,runTime*0.12);
  }

  /* entities */
  const airborne = jumpT>=0 && Math.sin(Math.PI*jumpT)>0.35;
  const sliding  = slideT>=0;
  for(const e of ents){
    e.d -= speed*dt;
    /* magnet pull */
    if(e.k==='coin' && magnetT>0 && e.d<50 && e.d>PLAYER_D-4){
      e.ln += (laneX-e.ln)*Math.min(1,dt*8);
    }
    if(e.dead) continue;
    const near = Math.abs(e.d-PLAYER_D)<3.2;
    if(near){
      const sameLane = Math.abs(e.ln-laneX)<0.5;
      if(e.k==='coin' && sameLane){
        e.dead=true; coinCombo++; comboTimer=1.4;
        const v=(doubleT>0?2:1);
        runCoins+=v; wallet+=v; totals.coins+=v;
        score+=10*v; sCoin(Math.min(coinCombo,8));
        burst(e,'#ffd94d',6);
      } else if(e.k==='pow' && sameLane){
        e.dead=true; totals.powerups++; sPow(); burst(e,'#c44dff',12);
        if(e.t==='magnet'){ magnetT=9; toast('🧲 MAGNET!'); }
        if(e.t==='shield'){ shield=true; toast('🛡 SHIELD!'); }
        if(e.t==='x2'){ doubleT=9; toast('✖2 SCORE!'); }
        missionProgress('powerups_total',1);
      } else if(e.k==='obs' && sameLane){
        const dodged = (e.t==='low'&&airborne) || (e.t==='high'&&sliding);
        if(!dodged && !e.hitDone){
          e.hitDone=true;
          if(shield){ shield=false; e.dead=true; toast('🛡 SHIELD SAVED YOU!'); burst(e,'#4d9fff',14); shake=8; }
          else { gameOver(); return; }
        }
      }
    }
    /* near-miss: obstacle passes the player in a lane we bailed from < .4s ago */
    if(e.k==='obs' && !e.passed && e.d<PLAYER_D-3.2){
      e.passed=true;
      if(Math.abs(e.ln-lastLaneSwap.lane)<0.5 && runTime-lastLaneSwap.at<0.4 && Math.abs(e.ln-laneX)>0.5){
        nearRun++; score+=50; sNear(); toast('NEAR MISS +50');
      }
    }
  }
  ents = ents.filter(e=>!e.dead && e.d>-8);

  /* particles */
  for(const p of parts){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=340*dt; p.life-=dt; }
  parts = parts.filter(p=>p.life>0);
  if(shake>0) shake=Math.max(0,shake-dt*30);
  if(hitFlash>0) hitFlash=Math.max(0,hitFlash-dt*2);

  /* HUD */
  document.getElementById('hudScore').textContent=score;
  document.getElementById('hudCoins').textContent='🪙 '+runCoins;
}
function burst(e,color,n){
  const pr=project(e.d,e.ln);
  for(let i=0;i<n;i++) parts.push({x:pr.x,y:pr.y-20*pr.sc,vx:(Math.random()-0.5)*260,
    vy:-Math.random()*220-40,life:0.5+Math.random()*0.3,c:color,s:3+Math.random()*3});
}

/* ============ draw ============ */
function draw(){
  const hy=horizonY();
  /* sky */
  const g=cx2.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0b0b2f'); g.addColorStop(0.34,'#1b1352'); g.addColorStop(0.6,'#241a63'); g.addColorStop(1,'#120d38');
  cx2.fillStyle=g; cx2.fillRect(0,0,W,H);
  /* stars */
  cx2.fillStyle='rgba(255,255,255,.7)';
  for(const s of stars) cx2.fillRect(s.x*W,s.y*H,s.s,s.s);
  /* sun */
  const sg=cx2.createRadialGradient(W/2,hy,4,W/2,hy,W*0.42);
  sg.addColorStop(0,'rgba(196,77,255,.5)'); sg.addColorStop(1,'rgba(196,77,255,0)');
  cx2.fillStyle=sg; cx2.fillRect(0,0,W,hy+60);

  cx2.save();
  if(shake>0) cx2.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

  /* road */
  const bl=project(0,-1.55), br=project(0,1.55), tl=project(D_MAX,-1.55), tr=project(D_MAX,1.55);
  cx2.fillStyle='#151138';
  cx2.beginPath(); cx2.moveTo(tl.x,hy); cx2.lineTo(tr.x,hy); cx2.lineTo(br.x,H); cx2.lineTo(bl.x,H); cx2.closePath(); cx2.fill();
  /* edge glow lines */
  for(const ln of [-1.55,1.55]){
    const a=project(D_MAX,ln), b=project(0,ln);
    cx2.strokeStyle='rgba(77,159,255,.8)'; cx2.lineWidth=3; cx2.shadowColor='#4d9fff'; cx2.shadowBlur=12;
    cx2.beginPath(); cx2.moveTo(a.x,a.y); cx2.lineTo(b.x,b.y); cx2.stroke(); cx2.shadowBlur=0;
  }
  /* moving lane stripes */
  cx2.strokeStyle='rgba(150,170,255,.35)'; cx2.lineWidth=2;
  const STRIPE=12;
  for(const ln of [-0.5,0.5]){
    for(let k=0;k<D_MAX/STRIPE+2;k++){
      let d0=(k*STRIPE - dist%STRIPE); if(d0<0) d0+=STRIPE;
      const d1=d0+STRIPE*0.45;
      if(d0>D_MAX) continue;
      const a=project(Math.min(D_MAX,d1),ln), b=project(d0,ln);
      cx2.beginPath(); cx2.moveTo(a.x,a.y); cx2.lineTo(b.x,b.y); cx2.stroke();
    }
  }

  /* entities far→near */
  const sorted=[...ents].sort((a,b)=>b.d-a.d);
  for(const e of sorted){
    const pr=project(e.d,e.ln); if(pr.p<=0.001) continue;
    const laneW=W*0.30*pr.sc;
    if(e.k==='coin'){
      const r=Math.max(3,11*pr.sc);
      cx2.fillStyle='#ffd94d'; cx2.shadowColor='#ffd94d'; cx2.shadowBlur=10*pr.sc;
      cx2.beginPath(); cx2.arc(pr.x,pr.y-16*pr.sc,r,0,7); cx2.fill(); cx2.shadowBlur=0;
      cx2.fillStyle='#b8860b'; cx2.beginPath(); cx2.arc(pr.x,pr.y-16*pr.sc,r*0.45,0,7); cx2.fill();
    } else if(e.k==='pow'){
      const r=Math.max(4,15*pr.sc);
      const col=e.t==='magnet'?'#4dffdf':e.t==='shield'?'#4d9fff':'#c44dff';
      cx2.fillStyle=col; cx2.shadowColor=col; cx2.shadowBlur=16*pr.sc;
      cx2.save(); cx2.translate(pr.x,pr.y-18*pr.sc); cx2.rotate(dist*0.05);
      cx2.fillRect(-r/1.4,-r/1.4,r*1.43,r*1.43); cx2.restore(); cx2.shadowBlur=0;
      if(pr.sc>0.3){ cx2.fillStyle='#08082a'; cx2.font=`bold ${Math.round(14*pr.sc)}px sans-serif`;
        cx2.textAlign='center'; cx2.fillText(e.t==='magnet'?'M':e.t==='shield'?'S':'2×',pr.x,pr.y-13*pr.sc); }
    } else { /* obstacle */
      const w=laneW*0.86;
      if(e.t==='block'){
        const h=Math.max(6,74*pr.sc);
        cx2.fillStyle='#ff4d6d'; cx2.shadowColor='#ff4d6d'; cx2.shadowBlur=14*pr.sc;
        cx2.fillRect(pr.x-w/2,pr.y-h,w,h); cx2.shadowBlur=0;
        cx2.fillStyle='rgba(255,255,255,.25)'; cx2.fillRect(pr.x-w/2,pr.y-h,w,Math.max(2,6*pr.sc));
      } else if(e.t==='low'){
        const h=Math.max(4,26*pr.sc);
        cx2.fillStyle='#ff9d4d'; cx2.shadowColor='#ff9d4d'; cx2.shadowBlur=12*pr.sc;
        cx2.fillRect(pr.x-w/2,pr.y-h,w,h); cx2.shadowBlur=0;
      } else { /* high — slide under */
        const h=Math.max(4,26*pr.sc), gap=Math.max(8,46*pr.sc);
        cx2.fillStyle='#4dffb0'; cx2.shadowColor='#4dffb0'; cx2.shadowBlur=12*pr.sc;
        cx2.fillRect(pr.x-w/2,pr.y-gap-h,w,h);
        cx2.fillRect(pr.x-w/2,pr.y-gap-h,Math.max(2,5*pr.sc),gap+h);
        cx2.fillRect(pr.x+w/2-Math.max(2,5*pr.sc),pr.y-gap-h,Math.max(2,5*pr.sc),gap+h);
        cx2.shadowBlur=0;
      }
    }
  }

  /* player */
  if(state==='play'||state==='over'){
    const pr=project(PLAYER_D,laneX);
    const jh = jumpT>=0 ? Math.sin(Math.PI*jumpT)*110*pr.sc : 0;
    const crouch = slideT>=0 ? 0.5 : 1;
    const bw=44*pr.sc, bh=54*pr.sc*crouch;
    const px=pr.x, py=pr.y-jh;
    /* trail */
    if(state==='play') parts.push({x:px+(Math.random()-0.5)*10,y:py-6,vx:(Math.random()-0.5)*40,
      vy:60,life:0.35,c:skin().trail,s:3});
    /* shadow */
    cx2.fillStyle='rgba(0,0,0,.4)';
    cx2.beginPath(); cx2.ellipse(pr.x,pr.y+4,bw*0.55,7*pr.sc,0,0,7); cx2.fill();
    /* body */
    cx2.fillStyle=skin().body; cx2.shadowColor=skin().body; cx2.shadowBlur=18;
    roundRect(px-bw/2,py-bh,bw,bh,10*pr.sc); cx2.fill(); cx2.shadowBlur=0;
    /* eye */
    cx2.fillStyle='#08082a';
    cx2.beginPath(); cx2.arc(px+bw*0.16,py-bh*0.72,4.5*pr.sc,0,7); cx2.fill();
    /* shield ring */
    if(shield){ cx2.strokeStyle='rgba(77,159,255,.9)'; cx2.lineWidth=3; cx2.shadowColor='#4d9fff'; cx2.shadowBlur=12;
      cx2.beginPath(); cx2.arc(px,py-bh/2,bw*0.85,0,7); cx2.stroke(); cx2.shadowBlur=0; }
    /* magnet aura */
    if(magnetT>0){ cx2.strokeStyle='rgba(77,255,223,.4)'; cx2.lineWidth=2;
      cx2.beginPath(); cx2.arc(px,py-bh/2,bw*(1.1+0.15*Math.sin(dist*0.15)),0,7); cx2.stroke(); }
  }

  /* particles */
  for(const p of parts){ cx2.globalAlpha=Math.max(0,p.life*2); cx2.fillStyle=p.c;
    cx2.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s); }
  cx2.globalAlpha=1;
  cx2.restore();

  if(hitFlash>0){ cx2.fillStyle=`rgba(255,60,80,${hitFlash*0.45})`; cx2.fillRect(0,0,W,H); }
}
function roundRect(x,y,w,h,r){
  cx2.beginPath();
  cx2.moveTo(x+r,y); cx2.arcTo(x+w,y,x+w,y+h,r); cx2.arcTo(x+w,y+h,x,y+h,r);
  cx2.arcTo(x,y+h,x,y,r); cx2.arcTo(x,y,x+w,y,r); cx2.closePath();
}

/* ============ loop ============ */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(state==='play') update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============ UI wiring ============ */
const $=id=>document.getElementById(id);
function show(id){ for(const s of ['menu','shop','over']) $(s).classList.add('hidden');
  if(id) $(id).classList.remove('hidden'); }
function renderMenu(){
  $('mBest').textContent=best; $('mCoins').textContent=wallet; $('mStreak').textContent=streak+'🔥';
  const box=$('mMissions'); box.innerHTML='';
  for(const m of missions){
    const def=missionDef(m.id), done=m.prog>=def.n;
    const el=document.createElement('div');
    el.className='mission'+(done?' done':'');
    el.innerHTML=`${done?'✔ ':''}${def.txt} — <span class="price">+${def.reward}🪙</span>
      <div class="bar"><i style="width:${Math.min(100,100*m.prog/def.n)}%"></i></div>`;
    box.appendChild(el);
  }
  $('streakTag').textContent = streakBonus>0
    ? `🔥 Day ${streak} streak — +${streakBonus} coins claimed!` : `🔥 ${streak}-day streak`;
}
function renderShop(){
  $('sCoins').textContent=wallet;
  const box=$('skinList'); box.innerHTML='';
  for(const s of SKINS){
    const has=owned.includes(s.id);
    const el=document.createElement('div');
    el.className='skin'+(skinId===s.id?' sel':'')+(has?'':' locked');
    el.innerHTML=`<div class="dot" style="background:${s.body};box-shadow:0 0 12px ${s.body}"></div>
      ${s.name}<br>${has?(skinId===s.id?'✔ ON':'tap to use'):`<span class="price">${s.cost}🪙</span>`}`;
    el.onclick=()=>{
      if(has){ skinId=s.id; store.set('skin',skinId); }
      else if(wallet>=s.cost){ wallet-=s.cost; owned.push(s.id); skinId=s.id;
        store.set('coins',wallet); store.set('owned',owned); store.set('skin',skinId); sPow(); }
      else { sHit(); }
      renderShop();
    };
    box.appendChild(el);
  }
}
function startRun(){
  rotateDoneMissions(); reset(); state='play';
  show(null); $('hud').classList.remove('hidden');
  $('hudBest').textContent='BEST '+best; $('streakTag').textContent='';
}
$('playBtn').onclick=startRun;
$('againBtn').onclick=startRun;
$('menuBtn').onclick=()=>{ state='menu'; renderMenu(); show('menu'); };
$('skinBtn').onclick=()=>{ renderShop(); show('shop'); };
$('backBtn').onclick=()=>{ renderMenu(); show('menu'); };

/* keep coin totals mission in sync at run end + periodically */
setInterval(()=>{ if(state==='play'){ store.set('coins',wallet); store.set('totals',totals);
  const before=JSON.stringify(missions);
  for(const m of missions){ const def=missionDef(m.id);
    if(def.type==='coins_total' && m.prog<def.n){ m.prog=Math.min(def.n,totals.coins);
      if(m.prog>=def.n){ wallet+=def.reward; store.set('coins',wallet); toast('✔ MISSION! +'+def.reward+' 🪙',true); } } }
  if(JSON.stringify(missions)!==before) store.set('missions',missions);
}},1500);

renderMenu();
</script>
